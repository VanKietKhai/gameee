<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Conan Server Control</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>Conan Server Control</h1>
      <p class="muted" id="server-name">Dedicated server</p>
    </div>
    <span id="status-pill" class="pill offline">OFFLINE</span>
  </header>

  <section class="cards">
    <article>
      <h2>Players</h2>
      <p class="stat" id="players">0 / 0</p>
    </article>
    <article>
      <h2>Uptime</h2>
      <p class="stat" id="uptime">—</p>
    </article>
    <article>
      <h2>Updates</h2>
      <p class="stat" id="updates">—</p>
    </article>
  </section>

  <section class="actions">
    <button data-action="/api/server/start">Start</button>
    <button data-action="/api/server/stop" class="danger">Stop</button>
    <button data-action="/api/server/restart">Restart</button>
    <button id="delayed">Delayed Restart</button>
    <button data-action="/api/server/backup">Backup</button>
    <button data-action="/api/server/check-updates">Check Updates</button>
    <button id="view-players">View Players</button>
    <button id="view-logs">View Logs</button>
    <button id="logout" class="ghost">Sign out</button>
  </section>

  <p id="banner" class="banner" hidden></p>

  <section>
    <h2>Activity</h2>
    <ul id="activity" class="log"></ul>
  </section>

  <section id="players-panel" hidden>
    <h2>Players</h2>
    <ul id="player-list" class="log"></ul>
  </section>

  <section id="logs-panel" hidden>
    <h2>Logs</h2>
    <ul id="log-list" class="log"></ul>
  </section>

  <script src="/js/site.js"></script>
</body>
</html>
