<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Conan Server" />
  <title>Conan Server</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1 id="server-name">Conan Server</h1>
      <p class="muted" id="uptime">&nbsp;</p>
    </div>
    <span id="status-pill" class="pill offline">ĐÃ TẮT</span>
  </header>

  <p id="banner" class="banner" hidden></p>

  <section id="countdown" class="countdown" hidden>
    <span id="countdown-text"></span>
    <button id="cancel-countdown" class="danger small">HUỶ HẸN GIỜ</button>
  </section>

  <section class="card">
    <h2>Direct Connect</h2>
    <div class="join">
      <code id="join-address">—</code>
      <button id="copy" class="ghost small">COPY</button>
    </div>
    <p class="muted" id="copy-feedback">&nbsp;</p>
  </section>

  <section class="card">
    <h2>Người chơi <span id="player-count">0 / 0</span></h2>
    <ul id="player-list" class="plain"></ul>
  </section>

  <section class="actions">
    <button id="start">BẬT SERVER</button>
    <button id="stop" class="danger">TẮT SERVER</button>
    <button id="restart" class="ghost">KHỞI ĐỘNG LẠI</button>
  </section>

  <section class="card">
    <h2>Thông tin</h2>
    <p class="muted" id="build">&nbsp;</p>
  </section>

  <section>
    <h2>Hoạt động gần đây</h2>
    <ul id="activity" class="log"></ul>
  </section>

  <button id="logout" class="ghost wide">Đăng xuất</button>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card">
      <p id="sheet-text"></p>
      <button id="sheet-later">Báo trước 30 / 10 / 5 / 1 phút</button>
      <button id="sheet-now" class="danger">Làm ngay</button>
      <button id="sheet-cancel" class="ghost">Thôi</button>
    </div>
  </div>

  <script src="/js/site.js"></script>
</body>
</html>
