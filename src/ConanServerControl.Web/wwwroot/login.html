<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Conan Server - Đăng nhập</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <h1>Conan Server</h1>
    <p class="muted">Điều khiển server từ xa qua Tailscale.</p>
    <form id="login-form">
      <label>Tên đăng nhập
        <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" value="admin" required />
      </label>
      <label>Mật khẩu
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="wide">ĐĂNG NHẬP</button>
      <p id="error" class="error" hidden></p>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.hidden = true;
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      if (response.ok) {
        window.location.href = '/';
        return;
      }
      error.textContent = response.status === 429
        ? 'Sai quá nhiều lần, thử lại sau 15 phút.'
        : 'Sai tên đăng nhập hoặc mật khẩu.';
      error.hidden = false;
    });
  </script>
</body>
</html>
